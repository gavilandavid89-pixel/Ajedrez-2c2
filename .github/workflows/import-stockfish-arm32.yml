name: Add official Stockfish ARM32 binary

on:
  # Ejecutar manualmente: el flujo sube un binario a main y no debe
  # volver a dispararse a sí mismo después de ese commit.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-arm32-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and validate official Android ARMv7 NEON binary
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/official-stockfish/Stockfish/releases/download/sf_19/stockfish-android-armv7-neon.tar.gz"
          curl --fail --location --retry 3 "$url" -o /tmp/stockfish-armv7.tar.gz
          mkdir -p /tmp/stockfish-armv7
          tar -xzf /tmp/stockfish-armv7.tar.gz -C /tmp/stockfish-armv7
          candidate=""
          while IFS= read -r candidate_file; do
            if file "$candidate_file" | grep -q 'ELF 32-bit.*ARM'; then
              candidate="$candidate_file"
              break
            fi
          done < <(find /tmp/stockfish-armv7 -type f -size +1M -print)
          if [ -z "$candidate" ]; then
            echo "El paquete oficial no contiene un ejecutable ELF32 ARM reconocible."
            find /tmp/stockfish-armv7 -type f -size +1M -exec file {} \;
            exit 1
          fi
          file "$candidate"
          readelf -h "$candidate" | grep -E 'Class:.*ELF32'
          readelf -h "$candidate" | grep -E 'Machine:.*ARM'
          target="ajedrez_2c2_v161/engine/stockfish/stockfish_android_arm32"
          install -m 755 "$candidate" "$target"
          test "$(stat -c %s "$target")" -gt 1000000
          sha256sum "$target"

      - name: Commit ARM32 engine
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ajedrez_2c2_v161/engine/stockfish/stockfish_android_arm32
          git commit -m "Add Stockfish Android ARM32 NEON engine"
          git push origin HEAD:main
