name: Test headless editor session bridge

on:
  push:
    branches:
      - test/headless-session-bridge
    paths:
      - "ajedrez_2c2_v161/addons/headless_session_bridge/**"
      - "ajedrez_2c2_v161/tools/headless_bridge/**"
      - "ajedrez_2c2_v161/project.godot"
      - ".github/workflows/test-headless-session-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-editor-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot and graphical test dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb imagemagick
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" \
            -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          echo "/tmp/godot" >> "$GITHUB_PATH"
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Open the graphical editor and connect the headless operator
        shell: bash
        run: |
          set -euo pipefail
          GODOT="Godot_v4.7.2-stable_linux.x86_64"
          PROJECT="ajedrez_2c2_v161"
          mkdir -p artifacts
          xvfb-run -a -s "-screen 0 1600x1000x24" bash -euo pipefail -c '
            "'"$GODOT"'" --editor --path "'"$PROJECT"'" --rendering-method gl_compatibility > /tmp/godot-editor.log 2>&1 &
            editor_pid=$!
            cleanup() {
              kill "$editor_pid" 2>/dev/null || true
              wait "$editor_pid" 2>/dev/null || true
            }
            trap cleanup EXIT
            "'"$GODOT"'" --headless --path "'"$PROJECT"'" --script res://tools/headless_bridge/bridge_probe.gd -- show_test_marker
            import -window root -silent artifacts/editor-with-headless-marker.png
            "'"$GODOT"'" --headless --path "'"$PROJECT"'" --script res://tools/headless_bridge/bridge_probe.gd -- clear_test_marker
            import -window root -silent artifacts/editor-after-revert.png
            test -s artifacts/editor-with-headless-marker.png
            test -s artifacts/editor-after-revert.png
          '

      - name: Upload editor screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headless-session-bridge-evidence
          path: |
            artifacts/
            /tmp/godot-editor.log
          if-no-files-found: warn
