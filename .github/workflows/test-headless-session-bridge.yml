name: Test headless editor session bridge

on:
  push:
    branches:
      - test/headless-session-bridge
    paths:
      - "ajedrez_2c2_v161/addons/headless_session_bridge/**"
      - "ajedrez_2c2_v161/tools/headless_bridge/**"
      - "ajedrez_2c2_v161/assets/fonts/**"
      - "ajedrez_2c2_v161/assets/ui_theme.tres"
      - "ajedrez_2c2_v161/project.godot"
      - ".github/workflows/test-headless-session-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-editor-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot and graphical test dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb imagemagick
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" \
            -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          echo "/tmp/godot" >> "$GITHUB_PATH"
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Import project resources and validate QA scripts
        shell: bash
        run: |
          set -euo pipefail
          GODOT="Godot_v4.7.2-stable_linux.x86_64"
          PROJECT="ajedrez_2c2_v161"
          mkdir -p artifacts
          "$GODOT" --headless --editor --path "$PROJECT" --import --quit > artifacts/import.log 2>&1
          "$GODOT" --headless --path "$PROJECT" --script res://tests/run_tests.gd > artifacts/project-tests.log 2>&1
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed loading resource:|ERROR:.*(does not exist|Could not load|No loader found)" artifacts/import.log artifacts/project-tests.log; then
            echo "Godot import or QA script validation reported resource/script errors."
            exit 1
          fi
          grep -q "RESULTADO FINAL:" artifacts/project-tests.log
          echo "PROJECT_IMPORT_AND_TESTS_PASS"

      - name: Verify discovery, live commands, editor restart, and reconnection
        shell: bash
        run: |
          set -euo pipefail
          GODOT="Godot_v4.7.2-stable_linux.x86_64"
          PROJECT="ajedrez_2c2_v161"
          xvfb-run -a -s "-screen 0 1600x1000x24" env GODOT="$GODOT" PROJECT="$PROJECT" bash -euo pipefail <<'SCRIPT'
          start_editor() {
            "$GODOT" --editor --path "$PROJECT" --rendering-method gl_compatibility --rendering-driver opengl3 --audio-driver Dummy >> /tmp/godot-editor.log 2>&1 &
            editor_pid=$!
          }

          wait_for_count() {
            local pattern="$1"
            local expected="$2"
            for _ in $(seq 1 120); do
              local count
              count=$(grep -c "$pattern" /tmp/session-watcher.log 2>/dev/null || true)
              if [ "$count" -ge "$expected" ]; then return 0; fi
              sleep 0.25
            done
            echo "Timed out waiting for $pattern count $expected"
            cat /tmp/session-watcher.log || true
            return 1
          }

          cleanup() {
            if [ -n "${watcher_pid:-}" ]; then kill "$watcher_pid" 2>/dev/null || true; wait "$watcher_pid" 2>/dev/null || true; fi
            if [ -n "${editor_pid:-}" ]; then kill "$editor_pid" 2>/dev/null || true; wait "$editor_pid" 2>/dev/null || true; fi
          }
          trap cleanup EXIT

          : > /tmp/godot-editor.log
          : > /tmp/session-watcher.log
          start_editor
          "$GODOT" --headless --path "$PROJECT" --script res://tools/headless_bridge/session_watcher.gd > /tmp/session-watcher.log 2>&1 &
          watcher_pid=$!
          wait_for_count "SESSION_CONNECTED" 1

          echo "Stopping editor to test loss detection..."
          kill "$editor_pid" 2>/dev/null || true
          wait "$editor_pid" 2>/dev/null || true
          editor_pid=""
          wait_for_count "SESSION_DISCONNECTED" 1

          echo "Restarting editor to test automatic reconnection..."
          start_editor
          wait_for_count "SESSION_CONNECTED" 2
          kill "$watcher_pid" 2>/dev/null || true
          wait "$watcher_pid" 2>/dev/null || true
          watcher_pid=""

          "$GODOT" --headless --path "$PROJECT" --script res://tools/headless_bridge/bridge_probe.gd -- show_test_marker
          import -window root -silent artifacts/editor-with-headless-marker.png
          "$GODOT" --headless --path "$PROJECT" --script res://tools/headless_bridge/bridge_probe.gd -- clear_test_marker
          import -window root -silent artifacts/editor-after-revert.png

          test -s artifacts/editor-with-headless-marker.png
          test -s artifacts/editor-after-revert.png
          changed_pixels=$(compare -metric AE artifacts/editor-with-headless-marker.png artifacts/editor-after-revert.png null: 2>&1 || true)
          changed_pixels="${changed_pixels%% *}"
          cp /tmp/session-watcher.log artifacts/session-watcher.log
          cp /tmp/godot-editor.log artifacts/godot-editor.log
          if ! [[ "$changed_pixels" =~ ^[0-9]+$ ]] || [ "$changed_pixels" -le 0 ]; then
            echo "Screenshot verification failed: no visible UI difference detected."
            exit 1
          fi
          echo "SCREENSHOT_DIFF_PASS changed_pixels=$changed_pixels"
          grep -q "SESSION_CONNECTED" /tmp/session-watcher.log
          grep -q "SESSION_DISCONNECTED" /tmp/session-watcher.log
          SCRIPT

      - name: Upload editor screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headless-session-bridge-evidence
          path: artifacts/
          if-no-files-found: warn
