name: Test headless editor session bridge

on:
  push:
    branches:
      - test/headless-session-bridge
    paths:
      - "ajedrez_2c2_v161/addons/headless_session_bridge/**"
      - "ajedrez_2c2_v161/tools/headless_bridge/**"
      - "ajedrez_2c2_v161/assets/fonts/**"
      - "ajedrez_2c2_v161/assets/ui_theme.tres"
      - "ajedrez_2c2_v161/project.godot"
      - ".github/workflows/test-headless-session-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-editor-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot and graphical test dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb imagemagick
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" \
            -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          echo "/tmp/godot" >> "$GITHUB_PATH"
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Import project resources and validate QA scripts
        shell: bash
        run: |
          set -euo pipefail
          GODOT="Godot_v4.7.2-stable_linux.x86_64"
          PROJECT="ajedrez_2c2_v161"
          mkdir -p artifacts
          # A cold import can log a transient missing-cache warning while the
          # editor theme is being initialized. Preserve that first log as
          # evidence, then validate a second startup against the completed cache.
          "$GODOT" --headless --editor --path "$PROJECT" --import --quit > artifacts/import.log 2>&1

          test -d "$PROJECT/.godot/imported"
          imported_font=$(find "$PROJECT/.godot/imported" -maxdepth 1 -type f -name 'Inter-Medium*.fontdata' -size +0c -print -quit)
          if [ -z "$imported_font" ]; then
            echo "Expected imported Inter-Medium font data was not generated."
            find "$PROJECT/.godot/imported" -maxdepth 1 -type f -printf '%f\\n' | sort | head -80
            exit 1
          fi
          echo "FONT_IMPORT_CACHE_PASS: $imported_font"

          "$GODOT" --headless --editor --path "$PROJECT" --quit > artifacts/editor-second-start.log 2>&1
          "$GODOT" --headless --path "$PROJECT" --script res://tests/run_tests.gd > artifacts/project-tests.log 2>&1

          if grep -E "SCRIPT ERROR:|Parse Error:|Failed loading resource:|ERROR:.*(does not exist|Could not load|No loader found)" artifacts/editor-second-start.log artifacts/project-tests.log; then
            echo "Godot reported persistent resource/script errors after the import cache was generated."
            exit 1
          fi
          grep -q "RESULTADO FINAL:" artifacts/project-tests.log
          echo "PROJECT_IMPORT_AND_TESTS_PASS"

      - name: Verify discovery, live commands, editor restart, and reconnection
        shell: bash
        run: |
          set -euo pipefail
          GODOT="Godot_v4.7.2-stable_linux.x86_64"
          PROJECT="ajedrez_2c2_v161"
          xvfb-run -a -s "-screen 0 1600x1000x24" env GODOT="$GODOT" PROJECT="$PROJECT" bash -euo pipefail <<'SCRIPT'
          start_editor() {
            "$GODOT" --editor --path "$PROJECT" --rendering-method gl_compatibility --rendering-driver opengl3 --audio-driver Dummy >> /tmp/godot-editor.log 2>&1 &
            editor_pid=$!
          }

          wait_for_count() {
            local pattern="$1"
            local expected="$2"
            for _ in $(seq 1 120); do
              local count
              count=$(grep -c "$pattern" /tmp/session-watcher.log 2>/dev/null || true)
              if [ "$count" -ge "$expected" ]; then return 0; fi
              sleep 0.25
            done
            echo "Timed out waiting for $pattern count $expected"
            cat /tmp/session-watcher.log || true
            return 1
          }

          cleanup() {
            if [ -n "${watcher_pid:-}" ]; then kill "$watcher_pid" 2>/dev/null || true; wait "$watcher_pid" 2>/dev/null || true; fi
            if [ -n "${editor_pid:-}" ]; then kill "$editor_pid" 2>/dev/null || true; wait "$editor_pid" 2>/dev/null || true; fi
          }
          trap cleanup EXIT

          : > /tmp/godot-editor.log
          : > /tmp/session-watcher.log
          start_editor
          "$GODOT" --headless --path "$PROJECT" --script res://tools/headless_bridge/session_watcher.gd > /tmp/session-watcher.log 2>&1 &
          watcher_pid=$!
          wait_for_count "SESSION_CONNECTED" 1

          echo "Stopping editor to test loss detection..."
          kill "$editor_pid" 2>/dev/null || true
          wait "$editor_pid" 2>/dev/null || true
          editor_pid=""
          wait_for_count "SESSION_DISCONNECTED" 1

          echo "Restarting editor to test automatic reconnection..."
          start_editor
          wait_for_count "SESSION_CONNECTED" 2
          # Keep the persistent watcher connected while one-shot commands
          # open independent TCP clients. Both must work at the same time.
          kill -0 "$watcher_pid"
          "$GODOT" --headless --path "$PROJECT" --script res://tools/headless_bridge/bridge_probe.gd -- show_test_marker
          import -window root -silent artifacts/editor-with-headless-marker.png
          "$GODOT" --headless --path "$PROJECT" --script res://tools/headless_bridge/bridge_probe.gd -- clear_test_marker
          import -window root -silent artifacts/editor-after-revert.png

          test -s artifacts/editor-with-headless-marker.png
          test -s artifacts/editor-after-revert.png
          "$GODOT" --headless --path "$PROJECT" --script res://tools/headless_bridge/bridge_probe.gd -- open_scene '{"path":"res://scenes/loading.tscn"}'
          # Reopening the already-active scene must still receive a definitive confirmation.
          "$GODOT" --headless --path "$PROJECT" --script res://tools/headless_bridge/bridge_probe.gd -- open_scene '{"path":"res://scenes/loading.tscn"}'
          # Equivalent normalized paths must compare consistently in the probe.
          "$GODOT" --headless --path "$PROJECT" --script res://tools/headless_bridge/bridge_probe.gd -- open_scene '{"path":"res://scenes/../scenes/loading.tscn"}'
          "$GODOT" --headless --path "$PROJECT" --script res://tools/headless_bridge/bridge_probe.gd -- inspect_scene | tee artifacts/scene-inspection.json
          # Scene paths must be relative to the edited scene root, never the editor's /root/... tree.
          grep -q '"path":"Background"' artifacts/scene-inspection.json
          grep -q '"runtime_path":"/root/' artifacts/scene-inspection.json
          grep -q '"inspector":' artifacts/scene-inspection.json
          grep -q '"property_count":' artifacts/scene-inspection.json
          grep -q '"name":"collision_layer"' artifacts/scene-inspection.json
          echo "DYNAMIC_INSPECTOR_DISCOVERY_PASS"
          "$GODOT" --headless --path "$PROJECT" --script res://tools/headless_bridge/bridge_probe.gd -- inspect_selection | tee artifacts/editor-selection.json
          grep -q '"selected_count":' artifacts/editor-selection.json
          echo "EDITOR_SELECTION_INSPECTION_PASS"
          if grep -q '"path":"/root/' artifacts/scene-inspection.json; then
            echo "Scene inspection leaked an editor runtime path into the stable scene path field."
            exit 1
          fi
          echo "SCENE_RELATIVE_PATHS_PASS"
          "$GODOT" --headless --path "$PROJECT" --script res://tools/headless_bridge/bridge_probe.gd -- list_project_resources
          "$GODOT" --headless --path "$PROJECT" --script res://tools/headless_bridge/bridge_probe.gd -- add_node '{"type":"Label","name":"HeadlessBridgeSmokeTest"}'
          "$GODOT" --headless --path "$PROJECT" --script res://tools/headless_bridge/bridge_probe.gd -- add_node '{"type":"StaticBody2D","name":"HeadlessCollisionBody"}'
          if "$GODOT" --headless --path "$PROJECT" --script res://tools/headless_bridge/bridge_probe.gd -- add_node '{"type":"CollisionShape2D","name":"InvalidLooseShape"}'; then
            echo "CollisionShape2D was incorrectly accepted under the non-physics scene root."
            exit 1
          fi
          "$GODOT" --headless --path "$PROJECT" --script res://tools/headless_bridge/bridge_probe.gd -- add_node '{"type":"CollisionShape2D","name":"HeadlessCollisionShape","parent_path":"HeadlessCollisionBody"}'
          "$GODOT" --headless --path "$PROJECT" --script res://tools/headless_bridge/bridge_probe.gd -- configure_collision_shape '{"node_path":"HeadlessCollisionBody/HeadlessCollisionShape","shape_type":"CircleShape2D","dimensions":{"radius":16}}'
          "$GODOT" --headless --path "$PROJECT" --script res://tools/headless_bridge/bridge_probe.gd -- set_node_properties '{"node_path":"HeadlessCollisionBody","properties":{"collision_layer":2,"collision_mask":3}}'
          # A rejected mixed update must be atomic: valid fields cannot leak through
          # when another field in the same request is not on the allowlist.
          if "$GODOT" --headless --path "$PROJECT" --script res://tools/headless_bridge/bridge_probe.gd -- set_node_properties '{"node_path":"HeadlessCollisionBody","properties":{"collision_layer":7,"arbitrary_property":true}}'; then
            echo "A mixed valid/invalid property update was incorrectly accepted."
            exit 1
          fi
          "$GODOT" --headless --path "$PROJECT" --script res://tools/headless_bridge/bridge_probe.gd -- inspect_scene | tee artifacts/atomic-property-inspection.json
          grep -q '"collision_layer":2' artifacts/atomic-property-inspection.json
          echo "ATOMIC_PROPERTY_REJECTION_PASS"
          "$GODOT" --headless --path "$PROJECT" --script res://tools/headless_bridge/bridge_probe.gd -- set_node_properties '{"node_path":"HeadlessCollisionBody/HeadlessCollisionShape","properties":{"disabled":false,"one_way_collision":true}}'
          "$GODOT" --headless --path "$PROJECT" --script res://tools/headless_bridge/bridge_probe.gd -- inspect_scene | tee artifacts/physics-scene-inspection.json
          grep -q '"collision_layer":2' artifacts/physics-scene-inspection.json
          grep -q '"collision_mask":3' artifacts/physics-scene-inspection.json
          grep -q '"one_way_collision":true' artifacts/physics-scene-inspection.json
          grep -q '"radius":16' artifacts/physics-scene-inspection.json
          echo "PHYSICS_PROPERTY_EDIT_PASS"
          kill -0 "$watcher_pid"
          echo "CONCURRENT_WATCHER_AND_PROBE_PASS"
          kill "$watcher_pid" 2>/dev/null || true
          wait "$watcher_pid" 2>/dev/null || true
          watcher_pid=""
          changed_pixels=$(compare -metric AE artifacts/editor-with-headless-marker.png artifacts/editor-after-revert.png null: 2>&1 || true)
          changed_pixels="${changed_pixels%% *}"
          cp /tmp/session-watcher.log artifacts/session-watcher.log
          cp /tmp/godot-editor.log artifacts/godot-editor.log
          if ! [[ "$changed_pixels" =~ ^[0-9]+$ ]] || [ "$changed_pixels" -le 0 ]; then
            echo "Screenshot verification failed: no visible UI difference detected."
            exit 1
          fi
          echo "SCREENSHOT_DIFF_PASS changed_pixels=$changed_pixels"
          grep -q "SESSION_CONNECTED" /tmp/session-watcher.log
          grep -q "SESSION_DISCONNECTED" /tmp/session-watcher.log
          SCRIPT

      - name: Upload editor screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headless-session-bridge-evidence
          path: artifacts/
          if-no-files-found: warn
